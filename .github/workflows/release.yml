name: Release Desktop Pet

on:
  push:
    tags:
      - "v0.4.17-beta.11"

permissions:
  contents: read

concurrency:
  group: desktop-pet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'hanbong5938/desktop-pet' && github.ref == 'refs/tags/v0.4.17-beta.11'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      DESKTOP_PET_DISTRIBUTION: neutral
      DESKTOP_PET_CARGO_TARGET: aarch64-apple-darwin
    steps:
      - name: Check out the immutable core revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/rig/package-lock.json

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install pinned JavaScript dependencies
        run: bun install --frozen-lockfile && npm ci --prefix web/rig

      - name: Validate independent product metadata and reviewed release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          bun scripts/release-docs.ts check "$tag" --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/desktop-pet-release-notes.md"
          version="${tag#v}"
          # This approved self-contained installer is pinned, never a mutable
          # latest script or a host manifest-derived app version.
          [[ "$tag" == v0.4.17-beta.11 && "$version" == 0.4.17-beta.11 ]]
          # Never overwrite an existing published or draft release/asset set.
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp)"
          [[ "$(printf '%s' "$releases" | jq --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | length')" == 0 ]]
          {
            echo "DESKTOP_PET_VERSION=$version"
            echo "DESKTOP_PET_ASSET_NAME=DesktopPet-v${version}-macos-arm64.tar.gz"
            echo "DESKTOP_PET_INSTALLER_NAME=desktop-pet-install-v${version}.sh"
          } >> "$GITHUB_ENV"

      - name: Install stable Rust and arm64 target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Gate independent workspace and release tooling
        shell: bash
        run: |
          set -euo pipefail
          bun run check
          bun test scripts/release-docs.test.ts scripts/wiki-docs.test.ts tools/repair-hair-pockets.test.ts web/rig
          node scripts/check-rig-deformation.mjs --output "$RUNNER_TEMP/rig-deformation"
          cargo fmt --check --all --manifest-path native/Cargo.toml
          cargo test --locked --workspace --target aarch64-apple-darwin --target-dir native/target/neutral --manifest-path native/Cargo.toml
          cargo test --locked --target aarch64-apple-darwin --target-dir native/target/neutral --manifest-path native/Cargo.toml -p desktop-pet --features test-support --test core_herdr_composition
          bun run build:native

      - name: Package the real ad-hoc signed app and helper
        run: bun run package:native

      - name: Verify distribution identity, arm64, system helper, signatures and Rubelia
        shell: bash
        run: |
          set -euo pipefail
          app="dist/DesktopPet.app"
          binary="$app/Contents/MacOS/desktop-pet"
          helper="$app/Contents/MacOS/desktop-pet-update-coordinator"
          for executable in "$binary" "$helper" "$app/Contents/MacOS/rig-decode-worker"; do
            [[ -f "$executable" && ! -L "$executable" && -x "$executable" ]]
            [[ "$(lipo -archs "$executable")" == arm64 ]]
            codesign --verify --strict "$executable"
          done
          for executable in "$binary" "$helper"; do
            "$executable" update-capabilities | node -e 'const c=JSON.parse(require("node:fs").readFileSync(0,"utf8")); if(c.protocol!==4||c.observation_mode!==2||c.integration_api!==1)process.exit(1);'
            "$executable" distribution-identity | node -e 'const c=JSON.parse(require("node:fs").readFileSync(0,"utf8")); if(c.distribution!=="neutral"||c.app_name!=="DesktopPet.app"||c.executable!=="desktop-pet"||c.helper!=="desktop-pet-update-coordinator"||c.app_version!==process.env.DESKTOP_PET_VERSION||c.bundle_id!=="io.github.hanbong5938.desktop-pet"||c.protocol!==4||c.observation_mode!==2||c.integration_api!==1||c.core_revision!==process.env.GITHUB_SHA||c.herdr_migration_revision!=null)process.exit(1);'
          done
          [[ "$("$binary" --version)" == "desktop-pet $DESKTOP_PET_VERSION" ]]
          [[ "$(otool -l "$helper")" != *'cmd LC_RPATH'* ]]
          dependencies="$(otool -L "$helper")"
          dependencies="${dependencies#*$'\n'}"
          [[ -n "$dependencies" ]]
          while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            read -r library _ <<< "$line"
            case "$library" in /usr/lib/*|/System/Library/*) ;; *) echo "error: non-system helper dependency: $library" >&2; exit 1 ;; esac
          done <<< "$dependencies"
          codesign --verify --deep --strict "$app"
          scratch="$(mktemp -d)"
          scratch="$(cd -- "$scratch" && pwd -P)"
          trap 'rm -rf "$scratch"' EXIT
          "$binary" pack validate --path "$app/Contents/Resources/default" --config-dir "$scratch/config" --state-dir "$scratch/state"
          mkdir "$scratch/bin"
          ln -s "$PWD/$binary" "$scratch/bin/desktop-pet"
          "$scratch/bin/desktop-pet" pack export default --config-dir "$scratch/config" --state-dir "$scratch/state" --output "$scratch/default.herdrchar"
          test -s "$scratch/default.herdrchar"

      - name: Create six immutable app and installer assets
        shell: bash
        run: |
          set -euo pipefail
          asset="$DESKTOP_PET_ASSET_NAME"
          sidecar="DesktopPet-v${DESKTOP_PET_VERSION}-rig-native.json"
          installer="$DESKTOP_PET_INSTALLER_NAME"
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "$asset" -C dist DesktopPet.app
          cp dist/DesktopPet.app.rig-native.json "$sidecar"
          cp scripts/install.sh "$installer"
          chmod 755 "$installer"
          shasum -a 256 "$asset" > "$asset.sha256"
          shasum -a 256 "$installer" > "$installer.sha256"
          shasum -a 256 "$asset" "$sidecar" "$installer" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          for output in "$asset" "$asset.sha256" SHA256SUMS "$sidecar" "$installer" "$installer.sha256"; do test -s "$output"; done
          # Verify the signed deployed bytes, not merely pre-signing rig inputs.
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {join,relative} from 'node:path';
          const root='dist/DesktopPet.app/Contents';
          const record=JSON.parse(await readFile('dist/DesktopPet.app.rig-native.json','utf8'));
          const identity=record.distribution_identity;
          if(record.version!==1||record.paths_relative_to!=='Contents'||record.core_revision!==process.env.GITHUB_SHA||identity?.core_revision!==record.core_revision||identity.distribution!=='neutral'||identity.app_version!==process.env.DESKTOP_PET_VERSION||identity.protocol!==4||identity.observation_mode!==2||identity.integration_api!==1||identity.migration_handover_protocol!==1||identity.herdr_migration_revision!=null)throw Error('invalid signed rig provenance');
          async function files(dir){const out=[];for(const e of await readdir(dir,{withFileTypes:true})){const p=join(dir,e.name);if(e.isDirectory())out.push(...await files(p));else if(e.isFile())out.push(relative(root,p));else throw Error('nonregular signed resource');}return out.sort();}
          const paths=await files(root);
          if(JSON.stringify(paths)!==JSON.stringify(Object.keys(record.deployed_sha256).sort()))throw Error('signed resource closure mismatch');
          for(const p of paths){if(createHash('sha256').update(await readFile(join(root,p))).digest('hex')!==record.deployed_sha256[p])throw Error(`deployed hash mismatch: ${p}`);}
          NODE

      - name: Prepare the complete neutral prerelease draft for qualification
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          overwrite_files: false
          body_path: ${{ runner.temp }}/desktop-pet-release-notes.md
          draft: true
          prerelease: true
          make_latest: false
          files: |
            ${{ env.DESKTOP_PET_ASSET_NAME }}
            ${{ env.DESKTOP_PET_ASSET_NAME }}.sha256
            SHA256SUMS
            DesktopPet-v${{ env.DESKTOP_PET_VERSION }}-rig-native.json
            ${{ env.DESKTOP_PET_INSTALLER_NAME }}
            ${{ env.DESKTOP_PET_INSTALLER_NAME }}.sha256

