name: Build authorized legacy 0.3.15 envelope

on:
  workflow_dispatch:
    inputs:
      core_revision:
        description: "Exact approved published v0.4.12 core commit (40 lowercase hex characters)"
        required: true
        type: string
      herdr_migration_revision:
        description: "Exact published integration-only Herdr v0.4.1 commit for approved managed retirement (40 lowercase hex)"
        required: true
        type: string
      authorize_legacy_0_3_15:
        description: "Authorize only the planned genuine legacy 0.3.15 distribution envelope"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-pet-legacy-0.3.15
  cancel-in-progress: false

jobs:
  bridge:
    if: github.repository == 'hanbong5938/desktop-pet' && inputs.authorize_legacy_0_3_15
    environment: legacy-bridge-build
    runs-on: macos-15
    env:
      CARGO_TERM_COLOR: always
      DESKTOP_PET_DISTRIBUTION: legacy-0.3.15
      DESKTOP_PET_CARGO_TARGET: aarch64-apple-darwin
      REQUESTED_CORE_REVISION: ${{ inputs.core_revision }}
      DESKTOP_PET_HERDR_MIGRATION_REV: ${{ inputs.herdr_migration_revision }}
    steps:
      - name: Check out exact common core source, not a host app fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.core_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify same published core revision and bounded envelope authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_CORE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_CORE_REVISION" ]]
          [[ "$(git rev-parse 'refs/tags/v0.4.12^{commit}')" == "$REQUESTED_CORE_REVISION" ]]
          [[ "$(plutil -extract name raw -o - package.json)" == desktop-pet ]]
          [[ "$(plutil -extract version raw -o - package.json)" == 0.4.12 ]]
          [[ "$DESKTOP_PET_HERDR_MIGRATION_REV" == 6d2ac0446f6ecb84f179e21fac3c5b02e07dc8e8 ]]

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/rig/package-lock.json

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Authenticate published immutable integration-only retirement target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="$DESKTOP_PET_HERDR_MIGRATION_REV"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ref" == 6d2ac0446f6ecb84f179e21fac3c5b02e07dc8e8 ]]
          gh api repos/hanbong5938/desktop-pet/releases/tags/v0.4.12 | jq -e '.draft == false and .prerelease == false and .published_at != null and .tag_name == "v0.4.12" and (.assets | length == 6) and (.assets as $assets | ["DesktopPet-v0.4.12-macos-arm64.tar.gz","DesktopPet-v0.4.12-macos-arm64.tar.gz.sha256","SHA256SUMS","DesktopPet-v0.4.12-rig-native.json","desktop-pet-install-v0.4.12.sh","desktop-pet-install-v0.4.12.sh.sha256"] | all(.[]; . as $name | any($assets[]; .name == $name and .state == "uploaded" and .size > 0)))' >/dev/null
          repository=hanbong5938/herdr-desktop-pet
          gh api "repos/$repository/releases/tags/v0.4.1" | jq -e '.draft == false and .prerelease == false and .published_at != null and .tag_name == "v0.4.1" and (.assets | length == 0)' >/dev/null
          for authority in "hanbong5938/desktop-pet v0.4.12 $REQUESTED_CORE_REVISION" "$repository v0.4.1 $ref"; do
            read -r repo tag expected <<< "$authority"
            [[ "$(gh api "repos/$repo/commits/$expected" --jq '.sha')" == "$expected" ]]
            object="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object')"
            for depth in 1 2 3 4 5 6 7 8; do
              type="$(printf '%s' "$object" | jq -r '.type')"
              sha="$(printf '%s' "$object" | jq -r '.sha')"
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
              if [[ "$type" == commit ]]; then break; fi
              [[ "$type" == tag ]]
              object="$(gh api "repos/$repo/git/tags/$sha" --jq '.object')"
            done
            [[ "$type" == commit && "$sha" == "$expected" ]]
          done
          # Authenticate the actually published neutral package source, not
          # merely a tag whose assets might carry a different build identity.
          gh release download v0.4.12 --repo hanbong5938/desktop-pet \
            --pattern DesktopPet-v0.4.12-rig-native.json --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/published-core"
          bun -e '
            const {createHash}=await import("node:crypto");
            const name="DesktopPet-v0.4.12-rig-native.json";
            const dir=process.env.RUNNER_TEMP+"/published-core/";
            const bytes=await Bun.file(dir+name).arrayBuffer();
            const entries=(await Bun.file(dir+"SHA256SUMS").text()).trim().split("\n").map(line=>line.trim().split(/\s+/)).filter(parts=>parts[1]?.replace(/^\*/,"")===name);
            if(entries.length!==1||entries[0].length!==2||!/^[a-f0-9]{64}$/.test(entries[0][0])||createHash("sha256").update(Buffer.from(bytes)).digest("hex")!==entries[0][0])throw Error("published core provenance checksum mismatch");
            const p=JSON.parse(Buffer.from(bytes).toString("utf8"));
            const i=p.distribution_identity;
            if(p.version!==1||p.paths_relative_to!=="Contents"||p.core_revision!==process.env.REQUESTED_CORE_REVISION||i?.core_revision!==p.core_revision||i.distribution!=="neutral"||i.app_version!=="0.4.12"||i.protocol!==4||i.observation_mode!==2||i.integration_api!==1||i.app_name!=="DesktopPet.app"||i.executable!=="desktop-pet"||i.helper!=="desktop-pet-update-coordinator"||i.bundle_id!=="io.github.hanbong5938.desktop-pet"||i.herdr_migration_revision!=null)throw Error("published core provenance identity mismatch");
          '
          # No existing public or draft bridge release may be replaced by this
          # successor build. Publication remains a separate authorization.
          releases="$(gh api "repos/$repository/releases?per_page=100" --paginate --slurp)"
          [[ "$(printf '%s' "$releases" | jq '[.[][] | select(.tag_name == "v0.3.15")] | length')" == 0 ]]
          tree="$(gh api "repos/$repository/git/commits/$ref" --jq '.tree.sha')"
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$repository/git/trees/$tree?recursive=1" | jq --arg tree "$tree" -e '
            .sha == $tree and .truncated == false and (.tree | type == "array") and (.tree | length <= 10000)
            and all(.tree[];
              ((.type == "tree" and .mode == "040000") or (.type == "blob" and (.mode == "100644" or .mode == "100755")))
              and (.path | type == "string")
              and ((.path | test("^(native|assets|dist|web|tools)(/|$)|^\\.agents/skills/(character-creator|create-pet-character)(/|$)|^scripts/(package-native\\.ts|build-rig-native\\.mjs|release-docs(\\.test)?\\.ts|wiki-docs(\\.test)?\\.ts|publish-wiki\\.sh)$|^\\.github/workflows/wiki\\.yml$|(^|/)(dist|target|node_modules|Contents|_CodeSignature|rig|rig-native|creator)(/|$)|(^|/)(Info\\.plist|RigLimits\\.(rs|swift)|desktop-pet|desktop-pet-update-coordinator|herdr-desktop-pet|herdr-update-coordinator|rig-decode-worker)$|(^|/)libherdr_rig|\\.(app|framework|bundle)(/|$)|\\.(tar(\\.(gz|bz2|xz|zst))?|tgz|tbz2?|txz|zip|gz|bz2|xz|zst|7z|rar|dmg|pkg|o|a|so|dylib|dll|exe|wasm|bin|herdrchar)(\\.(sha256|sha512))?$|(^|/)rig\\.json$|rig-native\\.json(\\.(sha256|sha512))?$"; "i")) | not)
            )' >/dev/null
          gh api "repos/$repository/contents/herdr-plugin.toml?ref=$ref" > "$RUNNER_TEMP/herdr-retirement-manifest.json"
          bun -e '
            const r=await Bun.file(process.env.RUNNER_TEMP+"/herdr-retirement-manifest.json").json();
            if(r.encoding!=="base64"||typeof r.content!=="string")throw Error("invalid immutable manifest response");
            const m=Bun.TOML.parse(Buffer.from(r.content,"base64").toString("utf8"));
            if(m.id!=="desktop-pet"||m.version!=="0.4.1"||m.min_herdr_version!=="0.9.3")throw Error("retirement target is not the published Herdr integration0.4.1 manifest");
            const hooks={build:[["bash","scripts/install.sh"]],startup:[["bash","scripts/run-native.sh","ensure"]],events:[["bash","scripts/run-native.sh","ensure"]]};
            for(const [kind,expected] of Object.entries(hooks))if(JSON.stringify(m[kind]?.map(h=>h.command))!==JSON.stringify(expected))throw Error("retirement manifest has non-consumer hooks");
            if(m.events[0].on!=="client.attached")throw Error("retirement event differs");
            const actions=["settings","start","ensure","stop","status","toggle","show","hide","passthrough","alpha_passthrough","show_bubble","hide_bubble","bubble_above","bubble_below","bubble_left","bubble_right","bubble_auto","reset","bigger","smaller","restart"];
            if(JSON.stringify(m.actions?.map(a=>a.id))!==JSON.stringify(actions)||m.actions.some(a=>JSON.stringify(a.command)!==JSON.stringify(["bash","scripts/run-native.sh",a.id])))throw Error("retirement actions are not exact consumer calls");
          '

      - name: Install pinned JavaScript dependencies
        run: bun install --frozen-lockfile && npm ci --prefix web/rig

      - name: Install stable Rust and arm64 target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Gate and build same source in its separate legacy target directory
        shell: bash
        run: |
          set -euo pipefail
          bun run check
          cargo fmt --check --all --manifest-path native/Cargo.toml
          cargo test --locked --workspace --target aarch64-apple-darwin --target-dir native/target/legacy-0.3.15 --manifest-path native/Cargo.toml
          bun run build:native
          bun run package:native

      - name: Validate packaged bridge through shipped ingress with logical TMPDIR
        shell: bash
        env:
          TMPDIR: /tmp
        run: |
          set -euo pipefail
          source migration/legacy-0.3.15/ingress/scripts/validate.sh
          revision="$REQUESTED_CORE_REVISION"
          migration_revision="$DESKTOP_PET_HERDR_MIGRATION_REV"
          [[ "$migration_revision" == 6d2ac0446f6ecb84f179e21fac3c5b02e07dc8e8 ]]
          validate_app "$PWD/dist/HerdrDesktopPet.app" 0.3.15

      - name: Verify real legacy app/helper identity and package migration evidence
        shell: bash
        run: |
          set -euo pipefail
          app=dist/HerdrDesktopPet.app
          binary="$app/Contents/MacOS/herdr-desktop-pet"
          helper="$app/Contents/MacOS/herdr-update-coordinator"
          [[ "$("$binary" --version)" == 'herdr-desktop-pet 0.3.15' ]]
          for executable in "$binary" "$helper"; do
            [[ -f "$executable" && ! -L "$executable" && -x "$executable" ]]
            [[ "$(lipo -archs "$executable")" == arm64 ]]
            codesign --verify --strict "$executable"
            "$executable" update-capabilities | node -e 'const c=JSON.parse(require("node:fs").readFileSync(0,"utf8"));if(c.protocol!==3||c.observation_mode!==1||c.integration_api!==1)process.exit(1);'
          done
          codesign --verify --deep --strict "$app"
          mkdir bridge-assets
          COPYFILE_DISABLE=1 tar --no-xattrs -czf bridge-assets/HerdrDesktopPet-v0.3.15-macos-arm64.tar.gz -C dist HerdrDesktopPet.app
          cp dist/HerdrDesktopPet.app.rig-native.json bridge-assets/HerdrDesktopPet-v0.3.15-rig-native.json
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const provenance=JSON.parse(await readFile('dist/HerdrDesktopPet.app.rig-native.json','utf8'));
          const identity=provenance.distribution_identity;
          if(provenance.core_revision!==process.env.REQUESTED_CORE_REVISION||identity?.core_revision!==provenance.core_revision||identity.distribution!=='legacy-0.3.15'||identity.app_version!=='0.3.15'||identity.protocol!==3||identity.observation_mode!==1||identity.integration_api!==1||identity.app_name!=='HerdrDesktopPet.app'||identity.executable!=='herdr-desktop-pet'||identity.helper!=='herdr-update-coordinator'||identity.bundle_id!=='dev.herdr.desktop-pet')throw Error('compiled bridge identity/revision mismatch');
          if(identity.herdr_migration_revision!==process.env.DESKTOP_PET_HERDR_MIGRATION_REV||!/^[a-f0-9]{40}$/.test(identity.herdr_migration_revision))throw Error('compiled managed-retirement ref differs from authenticated published integration');
          const archive='HerdrDesktopPet-v0.3.15-macos-arm64.tar.gz';
          const archive_sha256=createHash('sha256').update(await readFile(`bridge-assets/${archive}`)).digest('hex');
          const record={version:1,source_core_revision:provenance.core_revision,herdr_migration_revision:identity.herdr_migration_revision,distribution:identity.distribution,app_version:identity.app_version,protocol:identity.protocol,observation_mode:identity.observation_mode,integration_api:identity.integration_api,archive,archive_sha256,provenance:'HerdrDesktopPet-v0.3.15-rig-native.json'};
          await writeFile('bridge-assets/release.json',JSON.stringify(record,null,2)+'\n');
          NODE
          (cd bridge-assets && shasum -a 256 HerdrDesktopPet-v0.3.15-macos-arm64.tar.gz > HerdrDesktopPet-v0.3.15-macos-arm64.tar.gz.sha256 && shasum -a 256 HerdrDesktopPet-v0.3.15-macos-arm64.tar.gz HerdrDesktopPet-v0.3.15-rig-native.json release.json > SHA256SUMS && shasum -a 256 -c SHA256SUMS)

      - name: Gate real materialized managed Git admission without hiding user changes
        shell: bash
        run: |
          set -euo pipefail
          ingress="$RUNNER_TEMP/legacy-ingress-git-admission"
          bash migration/legacy-0.3.15/ingress/scripts/materialize-release.sh \
            "$PWD/bridge-assets/HerdrDesktopPet-v0.3.15-macos-arm64.tar.gz" \
            "$PWD/bridge-assets/HerdrDesktopPet-v0.3.15-rig-native.json" \
            "$PWD/bridge-assets/release.json" "$ingress"
          git -C "$ingress" init --quiet
          git -C "$ingress" add -- .gitignore herdr-plugin.toml release.json packaging-release.json rig-native-provenance.json scripts
          git -C "$ingress" -c user.name=desktop-pet-release-gate -c user.email=release-gate@localhost commit --quiet -m "Materialized ingress admission fixture"
          mkdir "$ingress/dist"
          ditto dist/HerdrDesktopPet.app "$ingress/dist/HerdrDesktopPet.app"
          [[ -z "$(git -C "$ingress" status --porcelain --untracked-files=all)" ]]
          printf 'User-owned source must remain visible to migration admission.\n' > "$ingress/user-owned-source.txt"
          printf 'Other dist files are not generated app ownership.\n' > "$ingress/dist/user-owned-note.txt"
          printf '\n# User source edit must remain visible to migration admission.\n' >> "$ingress/scripts/run-native.sh"
          dirty="$(git -C "$ingress" status --porcelain --untracked-files=all)"
          [[ "$dirty" == *'?? user-owned-source.txt'* ]]
          [[ "$dirty" == *'?? dist/user-owned-note.txt'* ]]
          [[ "$dirty" == *' M scripts/run-native.sh'* ]]
          printf 'Generated real app is clean; tracked source and unrelated untracked files remain protected:\n%s\n' "$dirty"

      - name: Save bridge bytes for separately authorized metadata-only ingress publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-pet-legacy-0.3.15-${{ inputs.core_revision }}
          path: bridge-assets/
          if-no-files-found: error
          retention-days: 30
          # This workflow has no old-repository write token. It never changes
          # v0.3.6, beta, or any previously published legacy release or formula.
