[package]
name = "desktop-pet"
version = "0.4.8"
edition = "2021"
publish = false

[features]
default = ["herdr", "tern"]
herdr = ["dep:desktop-pet-herdr"]
tern = ["dep:desktop-pet-tern"]
test-support = ["herdr", "desktop-pet-core/test-support", "desktop-pet-herdr/test-support"]

[dependencies]
desktop-pet-core = { path = "../core", version = "0.4.8" }
desktop-pet-update-coordinator = { path = "../update-coordinator", version = "0.4.8" }
desktop-pet-herdr = { git = "https://github.com/hanbong5938/herdr-desktop-pet", rev = "2a1dae743c2a67659e8a6782eff9a11714a31837", version = "0.1.0", optional = true }
desktop-pet-tern = { git = "https://github.com/hanbong5938/tern-desktop-pet", rev = "0c1b6ca173e9b31f191f92fa394a5a2429f7c099", version = "0.1.0", optional = true }

[dev-dependencies]
desktop-pet-contracts = { path = "../contracts", version = "0.1.0" }
tempfile = "=3.23.0"
serde_json = "1"

[[test]]
name = "core_herdr_composition"
required-features = ["test-support"]
