[package]
name = "desktop-pet"
version = "0.4.17-beta.10"
edition = "2021"
publish = false

[features]
default = ["herdr", "tern"]
herdr = ["dep:desktop-pet-herdr"]
tern = ["dep:desktop-pet-tern"]
test-support = ["herdr", "desktop-pet-core/test-support", "desktop-pet-herdr/test-support"]

[dependencies]
desktop-pet-core = { path = "../core", version = "0.4.17-beta.10" }
desktop-pet-update-coordinator = { path = "../update-coordinator", version = "0.4.17-beta.10" }
desktop-pet-herdr = { git = "https://github.com/hanbong5938/herdr-desktop-pet", rev = "0b9e24b2f6498311229a328ad144a4ab41b7505b", version = "0.1.0", optional = true }
desktop-pet-tern = { git = "https://github.com/hanbong5938/tern-desktop-pet", rev = "d9499f1c607a8a6766f65c0916cebd5a9126d7fd", version = "0.1.0", optional = true }

[dev-dependencies]
desktop-pet-contracts = { path = "../contracts", version = "0.1.0" }
tempfile = "=3.23.0"
serde_json = "1"

[[test]]
name = "core_herdr_composition"
required-features = ["test-support"]
