[package]
name = "desktop-pet"
version = "0.4.1"
edition = "2021"
publish = false

[features]
default = ["herdr", "tern"]
herdr = ["dep:desktop-pet-herdr"]
tern = ["dep:desktop-pet-tern"]

[dependencies]
desktop-pet-core = { path = "../core", version = "0.4.1" }
desktop-pet-update-coordinator = { path = "../update-coordinator", version = "0.4.1" }
desktop-pet-herdr = { git = "https://github.com/hanbong5938/herdr-desktop-pet", rev = "fb28be4477b9a529e046a0f033ad9e2cd888abea", version = "0.1.0", optional = true }
desktop-pet-tern = { git = "https://github.com/hanbong5938/tern-desktop-pet", rev = "0c1b6ca173e9b31f191f92fa394a5a2429f7c099", version = "0.1.0", optional = true }
