[package]
name = "desktop-pet"
version = "0.4.0"
edition = "2021"
publish = false

[features]
default = ["herdr", "tern"]
herdr = ["dep:desktop-pet-herdr"]
tern = ["dep:desktop-pet-tern"]

[dependencies]
desktop-pet-core = { path = "../core", version = "0.4.0" }
desktop-pet-update-coordinator = { path = "../update-coordinator", version = "0.4.0" }
desktop-pet-herdr = { git = "https://github.com/hanbong5938/herdr-desktop-pet", rev = "d220c3eed2f1b47997066c29e5d6f344585595c1", version = "0.1.0", optional = true }
desktop-pet-tern = { git = "https://github.com/hanbong5938/tern-desktop-pet", rev = "32baaa0943928a070342510cb1040ae75ed078e3", version = "0.1.0", optional = true }
